perItemPricing:
  description: >
    Per-item send costs for letters (UK pricing). Lower per-item prices are
    available on paid plans vs the Free plan. Postcards are priced separately.
  letters:
    currency: GBP
    tiers:
      - volumeMin: 1
        volumeMax: 2500
        freePrice: 0.88
        paidPrice: 0.82
      - volumeMin: 2501
        volumeMax: 9999
        freePrice: 0.88
        paidPrice: 0.48
      - volumeMin: 10000
        volumeMax: 49999
        freePrice: 0.88
        paidPrice: 0.44
      - volumeMin: 50000
        volumeMax: -1
        freePrice: 0.88
        paidPrice: 0.38

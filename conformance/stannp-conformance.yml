summary: >-
  Stannp's published conformance posture is strong on POSTAL and DATA-PROTECTION
  accreditation (Royal Mail PAF, Royal Mail Mail Made Easy, USPS CASS, ICO
  registration, HIPAA business associate, GDPR, ISO 9001/27001) and weak on API
  and web-standards conformance (no OAuth, no OIDC, no RFC 9457, no RFC 8594, no
  RFC 9116, no OpenAPI published by the provider). That split is the honest
  shape of a print-and-post company with a REST API attached.
standards:
  - id: oauth2
    conforms: false
    evidence: >-
      No oauth2 securityScheme in any spec and no OAuth documentation. Auth is a
      static account API key (HTTP Basic username, or `api_key` query parameter).
  - id: openid-connect
    conforms: false
    evidence: /.well-known/openid-configuration serves no document on any host.
  - id: http-basic-authentication
    conforms: true
    evidence: >-
      securitySchemes.basicAuth type http scheme basic across every spec;
      documented at https://www.stannp.com/us/direct-mail-api/guide.
  - id: tls-required
    conforms: true
    evidence: >-
      Stannp documents that HTTPS is mandatory and that plain-HTTP requests fail
      and may suspend the API key. TLSv1.3 observed on www, api-eu1 and api-us1
      (security/stannp-domain-security.yml).
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use a proprietary `{"success": false, "error": "..."}` envelope with
      content-type application/json, not application/problem+json. See
      errors/stannp-problem-types.yml.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No deprecation policy and no Sunset/Deprecation header documented.
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      /.well-known/security.txt is not served. www.stannp.com answers 200 with
      `{}` for every /.well-known/ path including a nonsense control path — a
      catch-all, not a document. See well-known/stannp-well-known.yml.
  - id: idempotency-key
    conforms: partial
    evidence: >-
      Idempotency IS supported, via an `idempotency_key` request PARAMETER rather
      than the IETF `Idempotency-Key` HEADER, and a replay returns HTTP 409 with
      the original body rather than the original status. Real capability,
      non-standard shape. See conventions/stannp-conventions.yml.
  - id: rate-limit-headers
    conforms: partial
    evidence: >-
      Returns the de-facto X-RateLimit-Limit / X-RateLimit-Remaining /
      X-RateLimit-Reset headers on every response, not the RFC 9331 / draft
      `RateLimit-*` form. No exhaustion status code or Retry-After documented.
  - id: webhook-hmac-signing
    conforms: true
    evidence: >-
      X-Stannp-Signature carries an HMAC-SHA256 digest of the raw body against a
      subscriber secret, with documented constant-time comparison guidance. See
      asyncapi/stannp-webhooks.yml.
  - id: asyncapi
    conforms: false
    evidence: No AsyncAPI document published; webhooks are documented in prose only.
  - id: openapi
    conforms: false
    evidence: >-
      Stannp publishes no OpenAPI or Swagger document. Probed /openapi.json,
      /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc
      on api-eu1, api-us1 and www — all 404 or HTML. Stannp DOES publish a
      machine-readable markdown reference at
      https://www.stannp.com/stannp-api-llm.md (saved at llms/stannp-api-llm.md),
      which is an LLM-oriented substitute, not an OpenAPI. The specs in openapi/
      are API Evangelist's own.
  - id: iso-3166-1-alpha-2
    conforms: true
    evidence: >-
      Country is an ISO 3166-1 alpha-2 code throughout (recipient.country,
      letters/post `country`, sms `country`).
  - id: iso-8601-timestamps
    conforms: partial
    evidence: >-
      Mixed. Some fields are ISO 8601 with offset ("2024-01-15T10:30:00+00:00",
      recipient/campaign created), others are space-separated
      "YYYY-MM-DD HH:MM:SS" (mailpiece timestamp, recipient created/updated in
      list responses). A consumer must handle both.
  - id: json-api
    conforms: false
    evidence: Proprietary success/data envelope; not JSON:API.
  - id: graphql
    conforms: false
    evidence: No /graphql surface documented or reachable.
  - id: mcp
    conforms: false
    evidence: >-
      No MCP server, hosted or local. See mcp/stannp-mcp.yml (candidate only).
  - id: a2a
    conforms: false
    evidence: >-
      No agent card at /.well-known/agent-card.json or /.well-known/agent.json on
      any host.

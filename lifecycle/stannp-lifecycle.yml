versioning:
  scheme: uri-path
  current: v1
  docs: https://www.stannp.com/us/direct-mail-api/guide
  history: >-
    v1 is the only version Stannp has ever published on the current API hosts.
    No v0 or v2 is documented and no version-negotiation header exists.
  regional_hosts:
    - url: https://api-eu1.stannp.com/v1
      region: EU / UK
    - url: https://api-us1.stannp.com/v1
      region: US / CA
  note: >-
    Region is selected by HOST rather than by version or parameter. A key issued
    in one region does not authenticate against the other.

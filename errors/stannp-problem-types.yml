format: custom-envelope
rfc9457: false
envelope:
  shape: '{ "success": false, "error": "Error message" }'
  fields:
    - name: success
      type: boolean
      description: Always false on an error.
    - name: error
      type: string
      description: A single human-readable message.
  content_type: application/json
  note: >-
    There is no machine-readable error code, no error type URI, no field-level
    validation detail and no problem+json media type. An agent has only the HTTP
    status plus a free-text string, so error handling must branch on status and
    treat `error` as opaque text. This is the largest agent-readiness gap on the
    Stannp API.
catalog_completeness: >-
  Stannp publishes a status-code table, not an error-code registry. The five
  statuses below are the complete documented set — confirmed identically in the
  guide's "API responses" table and in the provider's own LLM reference at
  https://www.stannp.com/stannp-api-llm.md. No error-code reference page exists.

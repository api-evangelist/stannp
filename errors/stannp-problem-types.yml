    remediation: >-
      Re-check the API key and that it is sent as the HTTP Basic username with an
      empty password, or as the `api_key` query parameter. Confirm the request is
      HTTPS and that the key belongs to the same region as the host being called
      (api-eu1 keys do not work on api-us1).
  - status: 404
    title: Not Found
    description: Resource does not exist or was deleted.
    documented: true
    source_operations:
      - openapi/stannp-postcards-api-openapi.yml#getPostcard
      - openapi/stannp-letters-api-openapi.yml#getLetter
      - openapi/stannp-recipients-api-openapi.yml#getRecipient
      - openapi/stannp-campaigns-api-openapi.yml#getCampaign
    remediation: Verify the ID and that the record was not deleted or purged.
  - status: 409
    title: Conflict — idempotent replay
    description: >-
      A duplicate idempotent request was detected. Stannp returns the ORIGINAL
      response body with a 409 status rather than re-executing the operation.
    documented: true
    source: https://www.stannp.com/us/direct-mail-api/idempotency-keys
    remediation: >-
      Treat 409 as SUCCESS, not failure — the original mailpiece was already
      created and the body of this response is that original result. Retrying
      again will not create a second mailpiece as long as the idempotency_key
      and the full request body are unchanged.
    note: >-
      This is the runtime semantic most likely to be mishandled by a generic
      HTTP client, which will classify 4xx as an error and may fall back to a
      non-idempotent retry — producing duplicate physical mail.
  - status: 500
    title: Internal Server Error
    description: Something went wrong at Stannp's end.
    documented: true
    remediation: >-
      Retry with backoff. A create call should carry the same `idempotency_key`
      on retry so a request that succeeded server-side but failed in transit is
      not duplicated.
undocumented_gaps:
  - concern: rate-limit exhaustion
    detail: >-
      Stannp documents the X-RateLimit-Limit / -Remaining / -Reset headers and
      the per-plan limits, but publishes NO status code for exceeding the limit
      and no Retry-After header. A client must derive its wait from
      X-RateLimit-Reset rather than from an exhaustion response.
  - concern: validation errors
    detail: >-
      Mandatory-parameter and address-validation failures are not given their own
      status or code in the documented table; they surface as free text in
      `error`.
